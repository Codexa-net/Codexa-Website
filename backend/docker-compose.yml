services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    command: >
      sh -c "npx prisma generate && npm run start:dev"

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-codexa_db}?schema=public
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET_is_required}"
      JWT_EXPIRES_IN_SECONDS: "${JWT_EXPIRES_IN_SECONDS:-3600}"
      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"

    ports:
      - "${APP_PORT:-3001}:3001"

    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules

  postgres:
    image: postgres:16-bookworm

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-codexa_db}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-codexa_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  backend_node_modules: